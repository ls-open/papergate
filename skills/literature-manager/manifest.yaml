name: literature-manager
version: 0.1.0
description: "文献管理：Zotero 同步、文献笔记、bib 条目操作、PDF 文本提取。"
commands:
  - name: lit
    entry: lit.py
    help: "文献管理统一入口（list / zotero / pdf2text / related / refresh-words）"
  - name: literature
    entry: lit.py
    help: "lit 的别名"
requires:
  - requests
  - pypinyin
  - yaml
  - fitz   # PyMuPDF：PDF 文本层提取（pdf2text / zotero 附件）
writes:
  - write/references.bib
  - references/notes/
  - references/pdfs/

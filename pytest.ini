[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
markers =
    live: 真实外部服务集成测试（Zotero 等）。默认跳过，需设置 PAPERGATE_LIVE=1 才运行（防止在真实文献库反复创建测试集合）。
    stage_writing: 写作期 check 行为测试（test_checks_writing / test_checks_basic 写作相关）
    stage_citation: 引用期 check 行为测试（test_checks_citation / test_bib_*）
    stage_review: 审查阶段相关测试（test_status_* / test_stage_*）
    stage_submission: 投稿期 check 行为测试（test_checks_submission / test_check_header_wrap）
    skills: 核心技能工具测试（test_rename_notes / test_note_section / test_skill_export_cli）
    smoke: 毫秒级快速健康检查（check 注册表/签名/无 fixture 类的核心契约，< 1s 跑完）
    e2e: 端到端链路测试（test_check_e2e* / test_e2e_pipeline / test_check_e2e_journey / test_characterization / test_check_framework_mode）
    fixtures: 仿真项目行为测试（test_fixture_behavior / test_fixture_negative_gaps）
    edges: 边界条件与异常输入测试（test_lib_common_edges / test_lib_fs / test_yaml_safety / test_bib_parser / test_check_autofix）

# Warning 过滤：净化 PyMuPDF/fitz 在 Python 3.11+ 触发但我们无法修复的第三方 SwigPy 弃用提示。
# 核心已移除文献技能；保留该过滤仅为兼容仍安装 PyMuPDF 的开发者环境。
filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap
    ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning
